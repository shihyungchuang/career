<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>四大職涯探索</title>
<meta name="author" content="莊士勇 Steven">
<style>
/* 一個 QR Code 佔滿一個畫面，上下滑動切換；下方按鈕可直接跳到某個測驗 */
:root { --bg: #ffffff; --text: #2b2b2b; --muted: #6b6b6b; --line: #e2e0da; --brand: #35628E; }
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
.screen {
  min-height: 100vh; min-height: 100svh;
  scroll-snap-align: start;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px 16px 84px; text-align: center;
}
.tab { margin: 0; font-size: 16px; font-weight: 700; color: var(--brand); }
h2 { margin: 4px 0 16px; font-size: 24px; }
.qr { width: min(88vw, 62svh, 520px); }
.qr svg { display: block; width: 100%; height: auto; }
.hint { margin: 14px 0 0; font-size: 15px; color: var(--muted); }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 96px; }
nav {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.96); border-top: 1px solid var(--line);
}
nav a {
  text-decoration: none; text-align: center; font-size: 15px; font-weight: 700;
  color: var(--brand); border: 1px solid var(--line); border-radius: 10px; padding: 10px 2px;
}
</style>
</head>
